[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-analytics-grouping"
version = "1.1.0"
description = "Multimodal Creative Dissection, Dynamic Multi-Brand Theme Clustering & Competitive Intelligence Engine"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Cheah Chuen Thong"}
]
keywords = [
    "multimodal",
    "clustering",
    "hdbscan",
    "umap",
    "competitive-intelligence",
    "finops",
    "advertising",
    "gemini",
]
dependencies = [
    "duckdb>=1.0.0",
    "hdbscan>=0.8.33",
    "imagehash>=4.3.1",
    "intel-core>=0.1.0",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "pillow>=10.0.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.7",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "umap-learn>=0.5.5",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2.2",
]
gcp = [
    "google-cloud-aiplatform>=1.38.0",
    "google-cloud-bigquery>=3.14.0",
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.uv.sources]
intel-core = { git = "https://github.com/citycheah/intel-core.git", tag = "v0.1.0" }

[tool.setuptools]
packages = ["intel_themes", "common", "ingestion"]
package-dir = { "intel_themes" = "src/intel_themes" }

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"embedding-clustering/*.py" = ["E402"]
