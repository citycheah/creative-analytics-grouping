[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-analytics-grouping"
version = "1.0.0"
description = "Multimodal Creative Analytics & Competitive Intelligence Engine"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Cheah Chuen Thong"}
]
keywords = [
    "multimodal",
    "clustering",
    "hdbscan",
    "umap",
    "competitive-intelligence",
    "finops",
    "advertising",
    "gemini",
    "vertex-ai",
    "streamlit"
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "hdbscan>=0.8.33",
    "umap-learn>=0.5.5",
    "Pillow>=10.0.0",
    "imagehash>=4.3.1",
    "sentence-transformers>=2.2.2",
    "google-cloud-bigquery>=3.14.0",
    "google-cloud-aiplatform>=1.38.0",
    "google-genai>=0.1.1",
    "pydantic>=2.0.0",
    "streamlit>=1.30.0",
    "altair>=5.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "python-json-logger>=2.0.7",
    "reportlab>=4.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
