  visual_weight: 0.3
  min_cluster_size: 4
  min_samples: 2
  umap_components: 30
  umap_seed: 42
  merge_threshold: 0.94
  text_embedding_model: "all-MiniLM-L6-v2"

gemini:
  model: "gemini-2.5-flash"
  thinking_budget: 0
