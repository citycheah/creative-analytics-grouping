# Per-advertiser configuration for Maxis (Malaysia Telco Showcase)
advertiser_name: "Maxis"
advertiser_names:
  - "MAXIS"
  - "MAXIS BROADBAND"
  - "HOTLINK"
  - "MAXIS BUSINESS"
country: "Malaysia"
competitors:
  - "Maxis"
  - "CelcomDigi"
  - "U Mobile"
  - "Unifi"
date_range:
  - "2026-01-01"
  - "2026-03-31"

clustering:
