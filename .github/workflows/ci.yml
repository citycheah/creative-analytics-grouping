name: CI Verification Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Run Ruff & Pytest Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run Ruff Lint
        run: |
          uv run ruff check src embedding-clustering common tests

      - name: Run Pytest Suite
        run: |
          uv run pytest tests/ -v
